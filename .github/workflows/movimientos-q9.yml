name: Herramientas y APK Movimientos Q9
on:
  push:
    branches: [movimientos-q9-nativa-v0-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    if: ${{ !contains(github.event.head_commit.message, '[apk]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Preparar SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          mkdir -p q9-tools/jdk q9-tools/sdk
          cp -a "$JAVA_HOME/bin" "$JAVA_HOME/lib" "$JAVA_HOME/conf" "$JAVA_HOME/release" q9-tools/jdk/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" q9-tools/sdk/build-tools
          cp "$ANDROID_HOME/platforms/android-35/android.jar" q9-tools/sdk/android.jar
          tar -czf Q9_native_tools.tar.gz q9-tools
      - uses: actions/upload-artifact@v4
        with:
          name: Q9_native_tools
          path: Q9_native_tools.tar.gz
          retention-days: 3
