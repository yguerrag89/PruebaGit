name: Build Ilubox WMS V0.13 Manual Asistida Local

on:
  push:
    branches: [ v0-13-manual-asistida-local ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Windows application
        working-directory: windows-project
        run: |
          python -m pip install -r requirements.txt
          python -B test_v22.py
          python -B test_wms_putaway.py
          python -B test_strict_pda_exchange.py
          python -B test_continuous_exchange.py
          python -B test_temporary_exchange.py
          python -B test_manual_assisted_exchange.py
          python -B test_streamlit_app.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Android engine and native exchange
        run: |
          mkdir -p test-bin test-output/v013
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java android-project/tests/ContinuousEngineSelfTest.java android-project/tests/TemporaryLocationSelfTest.java
          java -cp test-bin EngineSelfTest test-output/v013/manual-v4.json
          java -cp test-bin ContinuousEngineSelfTest android-project/tests/fixtures/v09-state.ser test-output/v013
          java -cp test-bin TemporaryLocationSelfTest android-project/tests/fixtures/v010-state.ser test-output/v013
          (cd windows-project && python -B test_temporary_exchange.py ../test-output/v013)
          (cd windows-project && python -B test_manual_assisted_exchange.py ../test-output/v013/manual-v4.json)

      - name: Build PDA APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ilubox-v0.13-validacion-Android
          path: |
            android-project/app/build/reports/lint-results-debug.*
            android-project/app/build/test-results/
          if-no-files-found: ignore

      - name: Package local deliverables
        run: |
          mkdir -p release/v0.13
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/v0.13/Ilubox_WMS_PDA_v0.13_Manual_Q9.apk
          python scripts/package_v013.py
          unzip -t release/v0.13/Ilubox_WMS_PDA_v0.13_Manual_Q9.apk
          unzip -t release/v0.13/Ilubox_WMS_Windows_v0.13_Manual_Asistida.zip
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/v0.13/Ilubox_WMS_PDA_v0.13_Manual_Q9.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/v0.13/Ilubox_WMS_PDA_v0.13_Manual_Q9.apk
          (cd release/v0.13 && sha256sum Ilubox_WMS_PDA_v0.13_Manual_Q9.apk Ilubox_WMS_Windows_v0.13_Manual_Asistida.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-WMS-v0.13-Manual-Asistida-Local
          path: release/v0.13/
