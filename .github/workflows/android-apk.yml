name: Build Ilubox WMS V0.12 Ubuntu LAN and PDA

on:
  push:
    branches: [ v0-12-servidor-lan-q9 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Windows application
        working-directory: windows-project
        run: |
          python -m pip install -r requirements.txt
          python -B test_v22.py
          python -B test_wms_putaway.py
          python -B test_strict_pda_exchange.py
          python -B test_continuous_exchange.py
          python -B test_temporary_exchange.py
          python -B test_streamlit_app.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate LAN server
        working-directory: server-project
        run: |
          python -m pip install -r requirements.txt httpx==0.28.1
          python -B -m unittest -v test_server

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate strict Android engine
        run: |
          mkdir -p test-bin
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java android-project/tests/ContinuousEngineSelfTest.java android-project/tests/TemporaryLocationSelfTest.java
          java -cp test-bin EngineSelfTest
          java -cp test-bin ContinuousEngineSelfTest android-project/tests/fixtures/v09-state.ser test-output/v011
          java -cp test-bin TemporaryLocationSelfTest android-project/tests/fixtures/v010-state.ser test-output/v011

      - name: Validate native Android export in Windows
        working-directory: windows-project
        run: python -B test_temporary_exchange.py ../test-output/v011

      - name: Build PDA APK
        working-directory: android-project
        run: |
          if ! gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest; then
            find app/build/test-results -name '*.xml' -exec sed -n '1,180p' {} \; || true
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              sed -n '1,450p' app/build/reports/lint-results-debug.txt
            elif [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
              sed -n '1,450p' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            fi
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ilubox-v0.12-validacion-Android
          path: |
            android-project/app/build/reports/lint-results-debug.*
            android-project/app/build/test-results/
          if-no-files-found: ignore

      - name: Validate native SQLite outbox in server
        working-directory: server-project
        run: python -B test_native_sync.py ../android-project/app/build/lan-fixtures

      - name: Package deliverables
        run: |
          mkdir -p release/v0.12
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/v0.12/Ilubox_WMS_PDA_v0.12_Q9.apk
          python scripts/package_v012.py
          unzip -t release/v0.12/Ilubox_WMS_PDA_v0.12_Q9.apk
          unzip -t release/v0.12/Ilubox_WMS_Ubuntu_v0.12.zip
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/v0.12/Ilubox_WMS_PDA_v0.12_Q9.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/v0.12/Ilubox_WMS_PDA_v0.12_Q9.apk
          (cd release/v0.12 && sha256sum Ilubox_WMS_PDA_v0.12_Q9.apk Ilubox_WMS_Ubuntu_v0.12.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-WMS-v0.12-Ubuntu-y-PDA
          path: release/v0.12/

      - name: Publish compiled files on the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- release/v0.12/Ilubox_WMS_PDA_v0.12_Q9.apk release/v0.12/Ilubox_WMS_Ubuntu_v0.12.zip release/v0.12/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "CI: agrega paquetes V0.12 LAN [skip ci]"
            git push
          fi
