name: Build Android APK V0.2

on:
  push:
    branches: [ v0-2-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct V0.1 base and apply V0.2 overlay
        run: |
          cat apkbuild/project.b64.part* | base64 -d > base-project.zip
          unzip -t base-project.zip
          mkdir android-project
          unzip -q base-project.zip -d android-project
          cp v02overlay/app/build.gradle android-project/app/build.gradle
          cp v02overlay/app/src/main/AndroidManifest.xml android-project/app/src/main/AndroidManifest.xml
          cp v02overlay/app/src/main/java/com/ilubox/descargapda/core/Position.java android-project/app/src/main/java/com/ilubox/descargapda/core/Position.java
          cp v02overlay/app/src/main/java/com/ilubox/descargapda/core/PositionCard.java android-project/app/src/main/java/com/ilubox/descargapda/core/PositionCard.java
          cp v02overlay/app/src/main/java/com/ilubox/descargapda/core/ScanResult.java android-project/app/src/main/java/com/ilubox/descargapda/core/ScanResult.java
          cp v02overlay/app/src/main/java/com/ilubox/descargapda/data/PilotDatabase.java android-project/app/src/main/java/com/ilubox/descargapda/data/PilotDatabase.java
          cat v02overlay/base64/UnloadEngine.part* | base64 -d > android-project/app/src/main/java/com/ilubox/descargapda/core/UnloadEngine.java
          cd android-project
          patch -p0 < ../v02overlay/patches/MainActivity.patch
          cd ..
          mkdir -p android-project/tests
          cp v02overlay/tests/EngineSelfTest.java android-project/tests/EngineSelfTest.java
      - name: Run engine self-test
        run: |
          mkdir -p test-bin
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java
          java -cp test-bin EngineSelfTest
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-Descarga-PDA-v0.2
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
