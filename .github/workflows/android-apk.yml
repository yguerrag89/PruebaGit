name: Build Android APK V0.3 Manual Q9

on:
  push:
    branches: [ v0-3-manual-q9 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct verified V0.2 base
        run: |
          cat v02build/project.b64.part* | base64 -d > project-v02.zip
          unzip -t project-v02.zip
          mkdir android-project
          unzip -q project-v02.zip -d android-project
          grep -q "versionName '0.2-piloto'" android-project/app/build.gradle

      - name: Apply V0.3 Manual Q9 patch
        run: |
          base64 -d v03/v02_to_v03.patch.gz.b64 | gzip -d > /tmp/v03.patch
          (cd android-project && patch -p3 --batch < /tmp/v03.patch)
          grep -q "versionName '0.3-manual-q9'" android-project/app/build.gradle
          grep -q 'ENGINE_VERSION = "0.3"' android-project/app/src/main/java/com/ilubox/descargapda/core/UnloadEngine.java
          grep -q 'scanManual' android-project/app/src/main/java/com/ilubox/descargapda/core/UnloadEngine.java
          grep -q 'CÓDIGO EN OTRA TARIMA' android-project/app/src/main/java/com/ilubox/descargapda/MainActivity.java
          grep -q 'dm.widthPixels <= 540' android-project/app/src/main/java/com/ilubox/descargapda/MainActivity.java

      - name: Run AUTO + MANUAL engine self-tests
        run: |
          mkdir -p test-bin
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java
          java -cp test-bin EngineSelfTest

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          unzip -t android-project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-project/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-Descarga-PDA-v0.3-Manual-Q9
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
