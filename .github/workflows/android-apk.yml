name: Build Android APK V0.2

on:
  push:
    branches: [ v0-2-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct V0.2 project
        run: |
          cat v02build/project.b64.part* | base64 -d > project-clean.zip
          unzip -t project-clean.zip
          mkdir android-project
          unzip -q project-clean.zip -d android-project
      - name: Run engine self-test
        run: |
          mkdir -p test-bin
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java
          java -cp test-bin EngineSelfTest
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-Descarga-PDA-v0.2
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
