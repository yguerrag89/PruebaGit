name: Build Ilubox WMS V0.10 Windows and PDA

on:
  push:
    branches: [ v0-10-operador-continuo-q9 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Windows application
        working-directory: windows-project
        run: |
          python -m pip install -r requirements.txt
          python -B test_v22.py
          python -B test_wms_putaway.py
          python -B test_strict_pda_exchange.py
          python -B test_continuous_exchange.py
          python -B test_streamlit_app.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate strict Android engine
        run: |
          mkdir -p test-bin
          javac -d test-bin android-project/app/src/main/java/com/ilubox/descargapda/core/*.java android-project/tests/EngineSelfTest.java android-project/tests/ContinuousEngineSelfTest.java
          java -cp test-bin EngineSelfTest
          java -cp test-bin ContinuousEngineSelfTest android-project/tests/fixtures/v09-state.ser test-output/v010

      - name: Validate native Android export in Windows
        working-directory: windows-project
        run: python -B test_continuous_exchange.py ../test-output/v010

      - name: Build PDA APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Package deliverables
        run: |
          git rm -f --ignore-unmatch -- release/Ilubox_WMS_PDA_v0.9_Q9.apk release/Ilubox_WMS_Windows_v0.9.zip release/SHA256SUMS.txt
          mkdir -p release
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/Ilubox_WMS_PDA_v0.10_Q9.apk
          (cd windows-project && zip -qr ../release/Ilubox_WMS_Windows_v0.10.zip . \
            -x '*/__pycache__/*' '*.pyc' 'data/sessions/*.json' 'data/sessions/*.tmp')
          unzip -t release/Ilubox_WMS_PDA_v0.10_Q9.apk
          unzip -t release/Ilubox_WMS_Windows_v0.10.zip
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/Ilubox_WMS_PDA_v0.10_Q9.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/Ilubox_WMS_PDA_v0.10_Q9.apk
          (cd release && sha256sum Ilubox_WMS_PDA_v0.10_Q9.apk Ilubox_WMS_Windows_v0.10.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Ilubox-WMS-v0.10-Windows-y-PDA
          path: release/

      - name: Publish compiled files on the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af release
          if ! git diff --cached --quiet; then
            git commit -m "CI: agrega instalables V0.10 [skip ci]"
            git push
          fi
