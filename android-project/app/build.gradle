plugins {
    id 'com.android.application'
}

dependencies {
    // Navegación de regreso compatible con Android 6 y gestos de Android 16.
    implementation 'androidx.activity:activity:1.12.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

android {
    namespace 'com.ilubox.descargapda'
    compileSdk 36

    defaultConfig {
        // Piloto paralelo: no reemplaza instalaciones anteriores ni copia sus sesiones.
        applicationId 'com.ilubox.descargapda.v015'
        minSdk 23
        targetSdk 36
        versionCode 17
        versionName '0.15-operacion-simplificada-q9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    testOptions { unitTests.includeAndroidResources = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
