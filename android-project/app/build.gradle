plugins {
    id 'com.android.application'
}

dependencies {
    // Navegación de regreso compatible con Android 6 y gestos de Android 16.
    implementation 'androidx.activity:activity:1.12.4'
}

android {
    namespace 'com.ilubox.descargapda'
    compileSdk 36

    defaultConfig {
        // Piloto paralelo: no exige desinstalar V0.9 ni depende de su firma debug.
        applicationId 'com.ilubox.descargapda.v010'
        minSdk 23
        targetSdk 36
        versionCode 12
        versionName '0.10-operador-continuo-q9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
