plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ilubox.descargapda'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ilubox.descargapda'
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName '0.8-wms-strict-q9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
